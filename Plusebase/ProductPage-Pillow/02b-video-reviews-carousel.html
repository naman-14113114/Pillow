  transition: transform 200ms var(--pb-ease), background 200ms ease !important;

}

#pb-vr-modal .pb-vr-modal-arrow.is-prev { left: -68px !important; }
#pb-vr-modal .pb-vr-modal-arrow.is-next { right: -68px !important; }

</style>

<div id="pb-prod-sec-video-reviews" class="pb-prod-section pb-prod-video-reviews" role="region" aria-label="Customer Video Reviews">
  <div class="pb-vr-header">
    <span class="pb-vr-eyebrow">REAL SLEEPERS</span>
    <h2 class="pb-vr-title">Real customer <span class="pb-vr-italic">video reviews</span> & results</h2>
  </div>

  <div class="pb-vr-carousel-wrap">
    <div class="pb-vr-track" id="pb-vr-track">
      <!-- Generated 30 Video Cards will be populated and duplicated dynamically by JS -->
    </div>
  </div>
</div>

<!-- Modal Popup with Frosted Whitish Blur Backdrop -->
<div id="pb-vr-modal" role="dialog" aria-modal="true" aria-label="Customer Video Review Lightbox">
  <div class="pb-vr-modal-inner" id="pb-vr-modal-inner">
    <button type="button" class="pb-vr-modal-arrow is-prev" id="pb-vr-prev" aria-label="Previous video">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <button type="button" class="pb-vr-modal-close" id="pb-vr-close" aria-label="Close video">&times;</button>
    <div class="pb-vr-player-box">
      <video id="pb-vr-modal-video" controls playsinline></video>
    </div>
    <button type="button" class="pb-vr-modal-arrow is-next" id="pb-vr-next" aria-label="Next video">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </div>
</div>

<script>
(function() {
  var SUPABASE_CDN_BASE = 'https://ekzlchsgeakwcnqgaglq.supabase.co/storage/v1/object/public/ruuhu_pillow_reviews/videos/pillow-reviews';
  var videoData = [];
  for (var i = 1; i <= 30; i++) {
    var num = (i < 10 ? '0' : '') + i;
    videoData.push({
      id: 'pillow-review-' + num,
      poster: SUPABASE_CDN_BASE + '/posters/pillow-review-' + num + '-poster.jpg',
      clip: SUPABASE_CDN_BASE + '/clips/pillow-review-' + num + '-clip.mp4',
      full: SUPABASE_CDN_BASE + '/pillow-review-' + num + '.mp4'
    });
  }

  var track = document.getElementById('pb-vr-track');
  var modal = document.getElementById('pb-vr-modal');
  var modalVideo = document.getElementById('pb-vr-modal-video');
  var modalInner = document.getElementById('pb-vr-modal-inner');
  var closeBtn = document.getElementById('pb-vr-close');
  var prevBtn = document.getElementById('pb-vr-prev');
  var nextBtn = document.getElementById('pb-vr-next');

  if (!track) return;

  var currentIndex = 0;

  function renderCards() {
    var html = '';
    // Duplicate 2x for seamless infinite marquee loop
    var allItems = videoData.concat(videoData);
    for (var j = 0; j < allItems.length; j++) {
      var item = allItems[j];
      var origIdx = j % videoData.length;
      html += '<div class="pb-vr-card" data-video-index="' + origIdx + '" role="button" tabindex="0" aria-label="Customer review video ' + (origIdx + 1) + '">';
      html += '<video src="' + item.clip + '" poster="' + item.poster + '" autoplay loop muted playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>';
      html += '<div class="pb-vr-scrim"></div>';
      html += '<div class="pb-vr-play-overlay"><div class="pb-vr-play-btn"><svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M4.5 5.653c0-1.427 1.529-2.33 2.779-1.643l11.54 6.347c1.295.712 1.295 2.573 0 3.286L7.28 19.99c-1.25.687-2.779-.217-2.779-1.643V5.653Z" clip-rule="evenodd" /></svg></div></div>';
      html += '</div>';
    }
    track.innerHTML = html;

    var cards = track.querySelectorAll('.pb-vr-card');
    cards.forEach(function(card) {
      var v = card.querySelector('video');
      if (v) {
        v.muted = true;
        v.defaultMuted = true;
        v.playsInline = true;
        v.loop = true;
        v.play().catch(function() {});
        v.addEventListener('canplay', function() {
          v.play().catch(function() {});
        });
        v.addEventListener('loadeddata', function() {
          v.play().catch(function() {});
        });
      }
      card.addEventListener('mouseenter', function() {
        track.style.animationPlayState = 'paused';
      });
      card.addEventListener('mouseleave', function() {
        track.style.animationPlayState = 'running';
      });
      card.addEventListener('click', function() {
        var idx = parseInt(card.getAttribute('data-video-index'), 10);
        openModal(idx);
      });
      card.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          var idx = parseInt(card.getAttribute('data-video-index'), 10);
          openModal(idx);
        }
      });
    });
  }

  function kickstartVideos() {
    var vids = track.querySelectorAll('video');
    vids.forEach(function(v) {
      if (v.paused) {
        v.muted = true;
        v.play().catch(function() {});
      }
    });
  }

  ['scroll', 'touchstart', 'click'].forEach(function(evt) {
    window.addEventListener(evt, kickstartVideos, { passive: true });
  });

  function openModal(index) {
    if (!modal || !modalVideo) return;
    currentIndex = index;
    var item = videoData[currentIndex];
    modalVideo.src = item.full;
    modalVideo.poster = item.poster;
    modal.classList.add('is-open');
    document.body.style.overflow = 'hidden';
    modalVideo.play().catch(function() {});
  }

  function closeModal() {
    if (!modal || !modalVideo) return;
    modal.classList.remove('is-open');
    modalVideo.pause();
    modalVideo.src = '';
    document.body.style.overflow = '';
  }

  function prevVideo() {
    currentIndex = (currentIndex > 0) ? currentIndex - 1 : videoData.length - 1;
    openModal(currentIndex);
  }

  function nextVideo() {
    currentIndex = (currentIndex < videoData.length - 1) ? currentIndex + 1 : 0;
    openModal(currentIndex);
  }

  if (closeBtn) closeBtn.addEventListener('click', closeModal);
  if (prevBtn) prevBtn.addEventListener('click', function(e) { e.stopPropagation(); prevVideo(); });
  if (nextBtn) nextBtn.addEventListener('click', function(e) { e.stopPropagation(); nextVideo(); });

  if (modal) {
    modal.addEventListener('click', function(e) {
      if (e.target === modal) closeModal();
    });
  }

  // Touch Swipe for Mobile
  var touchStartX = null;
  if (modal) {
    modal.addEventListener('touchstart', function(e) {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    modal.addEventListener('touchend', function(e) {
      if (touchStartX === null) return;
      var touchEndX = e.changedTouches[0].clientX;
      var diff = touchStartX - touchEndX;
      if (diff > 50) {
        nextVideo();
      } else if (diff < -50) {
        prevVideo();
      }
      touchStartX = null;
    }, { passive: true });
  }

  // Keyboard Navigation
  document.addEventListener('keydown', function(e) {
    if (!modal || !modal.classList.contains('is-open')) return;
    if (e.key === 'Escape') closeModal();
    else if (e.key === 'ArrowLeft') prevVideo();
    else if (e.key === 'ArrowRight') nextVideo();
  });

  renderCards();
})();
</script>
