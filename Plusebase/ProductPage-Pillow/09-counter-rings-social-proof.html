<script>
(function() {
  function initCountup() {
    var root = document.getElementById('pb-prod-sec-counter');
    if (!root || root.dataset.initialized === 'true') return;
    root.dataset.initialized = 'true';

    var rings = root.querySelectorAll('.pb-cnt-ring');

    if ('IntersectionObserver' in window) {
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (!entry.isIntersecting) return;
          var ring = entry.target;
          var targetVal = parseInt(ring.dataset.target, 10) || 0;
          var circle = ring.querySelector('.pb-cnt-progress');
          var label = ring.querySelector('.pb-cnt-number');

          if (circle) circle.style.strokeDashoffset = 100 - targetVal;

          var startedAt = performance.now();
          var duration = 1100;

          function updateNumber(now) {
            var progress = Math.min((now - startedAt) / duration, 1);
            var eased = 1 - Math.pow(1 - progress, 4);
            var currentVal = Math.round(targetVal * eased);
            if (label) label.textContent = currentVal + '%';
            if (progress < 1) requestAnimationFrame(updateNumber);
          }

          requestAnimationFrame(updateNumber);
          observer.unobserve(ring);
        });
      }, { threshold: 0.35 });

      rings.forEach(function(ring) { observer.observe(ring); });
    } else {
      rings.forEach(function(ring) {
        var targetVal = parseInt(ring.dataset.target, 10) || 0;
        var circle = ring.querySelector('.pb-cnt-progress');
        var label = ring.querySelector('.pb-cnt-number');
        if (circle) circle.style.strokeDashoffset = 100 - targetVal;
        if (label) label.textContent = targetVal + '%';
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCountup);
  } else {
    initCountup();
  }
})();
</script>
