<script>
(function() {
  function initCountup() {
    var root = document.getElementById('pb-prod-sec-counter');
    if (!root || root.dataset.initialized === 'true') return;
    root.dataset.initialized = 'true';

    var rings = root.querySelectorAll('.pb-cnt-ring');
    var circumference = 314.159; // 2 * Math.PI * 50

    function animateRing(ring) {
      if (ring.dataset.animated === 'true') return;
      ring.dataset.animated = 'true';

      var targetVal = parseInt(ring.dataset.target, 10) || 0;
      var circle = ring.querySelector('.pb-cnt-progress');
      var label = ring.querySelector('.pb-cnt-number');

      var startedAt = performance.now();
      var duration = 1100; // Exact Vercel countup timing

      function update(now) {
        var progress = Math.min((now - startedAt) / duration, 1);
        // Exact Vercel Quartic Ease-Out curve
        var eased = 1 - Math.pow(1 - progress, 4);
        var currentProgress = targetVal * eased;
        var currentVal = Math.round(currentProgress);
        var currentOffset = circumference * (1 - currentProgress / 100);

        if (label) label.textContent = currentVal + '%';
        if (circle) {
          circle.style.setProperty('stroke-dashoffset', currentOffset + 'px', 'important');
          circle.setAttribute('stroke-dashoffset', currentOffset.toFixed(2));
        }

        if (progress < 1) {
          requestAnimationFrame(update);
        } else {
          if (label) label.textContent = targetVal + '%';
          var finalOffset = circumference * (1 - targetVal / 100);
          if (circle) {
            circle.style.setProperty('stroke-dashoffset', finalOffset + 'px', 'important');
            circle.setAttribute('stroke-dashoffset', finalOffset.toFixed(2));
          }
        }
      }

      requestAnimationFrame(update);
    }

    if ('IntersectionObserver' in window && rings.length > 0) {
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            animateRing(entry.target);
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.2 });

      rings.forEach(function(ring) { observer.observe(ring); });
    } else {
      rings.forEach(function(ring) { animateRing(ring); });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCountup);
  } else {
    initCountup();
  }
  window.addEventListener('load', initCountup);
  window.addEventListener('plusbase:custom-html:ready', initCountup);
})();
</script>
