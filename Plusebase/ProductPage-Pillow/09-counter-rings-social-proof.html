#pb-prod-sec-countup .pb-countup-container {

#pb-prod-sec-countup .pb-section-heading {

}

#pb-prod-sec-countup .pb-section-heading h2 {

}

#pb-prod-sec-countup .pb-section-heading p {
  margin: 10px 0 0;
  color: var(--pb-muted);
  font-size: 15px;
}

#pb-prod-sec-countup .pb-counter-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
  margin: 36px auto 36px;
}

#pb-prod-sec-countup .pb-counter-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 290px;

  border-radius: 12px;

  box-shadow: 0 4px 16px rgba(6, 23, 59, 0.05);
  transition: transform 300ms var(--pb-ease), box-shadow 300ms var(--pb-ease);
}

#pb-prod-sec-countup .pb-counter-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 28px rgba(6, 23, 59, 0.1);
}

#pb-prod-sec-countup .pb-counter-ring {
  position: relative;
  display: grid;
  width: 150px;
  height: 150px;
  place-items: center;
  border-radius: 50%;
}

#pb-prod-sec-countup .pb-counter-ring svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

#pb-prod-sec-countup .pb-counter-track,
#pb-prod-sec-countup .pb-counter-progress {
  fill: none;
  stroke-width: 8;
}

#pb-prod-sec-countup .pb-counter-track {
  stroke: var(--pb-line);
}

#pb-prod-sec-countup .pb-counter-progress {
  stroke: var(--pb-blue);
  stroke-dasharray: 100;
  stroke-dashoffset: 100;
  stroke-linecap: round;
  transition: stroke-dashoffset 1.1s cubic-bezier(0.22, 1, 0.36, 1);
}

#pb-prod-sec-countup .pb-counter-ring span {
  position: relative;
  color: var(--pb-blue);
  font-size: 32px;
  font-weight: 750;
}

#pb-prod-sec-countup .pb-counter-card p {
  max-width: 220px;
  margin: 14px 0 0;
  color: var(--pb-ink);
  font-size: 13px;
  line-height: 1.45;

}

#pb-prod-sec-countup .pb-shop-now-btn {

  cursor: pointer;
  box-shadow: 0 4px 14px rgba(7, 87, 217, 0.25);

#pb-prod-sec-countup .pb-shop-now-btn:hover {

@media (max-width: 860px) {

<script>
(function() {
  function initCountup() {
    var root = document.getElementById('pb-prod-sec-countup');
    if (!root || root.dataset.initialized === 'true') return;
    root.dataset.initialized = 'true';

    var rings = root.querySelectorAll('.pb-counter-ring');

    if ('IntersectionObserver' in window) {
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (!entry.isIntersecting) return;
          var ring = entry.target;
          var targetVal = parseInt(ring.dataset.target, 10) || 0;
          var circle = ring.querySelector('.pb-counter-progress');
          var label = ring.querySelector('.pb-counter-number');

          if (circle) circle.style.strokeDashoffset = 100 - targetVal;

          var startedAt = performance.now();
          var duration = 1100;

          function updateNumber(now) {
            var progress = Math.min((now - startedAt) / duration, 1);
            var eased = 1 - Math.pow(1 - progress, 4);
            var currentVal = Math.round(targetVal * eased);
            if (label) label.textContent = currentVal + '%';
            if (progress < 1) requestAnimationFrame(updateNumber);
          }

          requestAnimationFrame(updateNumber);
          observer.unobserve(ring);
        });
      }, { threshold: 0.35 });

      rings.forEach(function(ring) { observer.observe(ring); });
    } else {
      rings.forEach(function(ring) {
        var targetVal = parseInt(ring.dataset.target, 10) || 0;
        var circle = ring.querySelector('.pb-counter-progress');
        var label = ring.querySelector('.pb-counter-number');
        if (circle) circle.style.strokeDashoffset = 100 - targetVal;
        if (label) label.textContent = targetVal + '%';
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCountup);
  } else {
    initCountup();
  }
})();
</script>
