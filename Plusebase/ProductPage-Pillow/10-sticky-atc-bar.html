<style>
/* PlusBase Wrapper Normalization (Scoped Strictly to this Custom Section via :has) */
.wb-section:has(#pb-prod-sec-sticky),
.column-inner:has(#pb-prod-sec-sticky),
.custom-code:has(#pb-prod-sec-sticky),
.custom-code__content:has(#pb-prod-sec-sticky) {
  margin: 0 !important;
  padding: 0 !important;
}

/* Suppress side cart drawer ONLY during Add to Cart flow, keeping header cart icon 100% functional */
body.pb-atc-in-progress #default_cart_drawer,
body.pb-atc-in-progress #popup-overlay-default_cart_drawer,
body.pb-atc-in-progress [id*="cart_drawer"],
body.pb-atc-in-progress [id*="cart-drawer"],
body.pb-atc-in-progress [data-section-id*="cart_drawer"],
body.pb-atc-in-progress [data-section-id*="cart-drawer"],
body.pb-atc-in-progress .section-popup:has([id*="cart_drawer"]),
body.pb-atc-in-progress .section-popup:has([id*="cart-drawer"]),
body.pb-atc-in-progress .wb-cart-drawer,
body.pb-atc-in-progress .cart-drawer,
body.pb-atc-in-progress .side-cart,
body.pb-atc-in-progress .mini-cart {
  display: none !important;
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
  transform: translateX(100%) !important;
}

#pb-prod-sec-sticky {
  --pb-navy: #06173b;
  --pb-ink: #10223f;
  --pb-blue: #0757d9;
  --pb-paper: #ffffff;
  --pb-muted: #60708a;
  --pb-line: #cbd9e8;
  --pb-mist: #f7fbff;
  --pb-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --pb-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --pb-font-display: "Playfair Display", Georgia, "Times New Roman", serif;

  position: fixed !important;
  bottom: 18px !important;
  left: 50% !important;
  transform: translate(-50%, calc(100% + 40px)) !important;
  z-index: 999999 !important;
  width: min(840px, calc(100% - 32px)) !important;
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
  transition: transform 320ms var(--pb-ease), opacity 260ms var(--pb-ease), visibility 260ms var(--pb-ease) !important;
  box-sizing: border-box !important;
  font-family: var(--pb-font) !important;
}

#pb-prod-sec-sticky.visible {
  transform: translate(-50%, 0) !important;
  opacity: 1 !important;
  visibility: visible !important;
  pointer-events: auto !important;
}

#pb-prod-sec-sticky *,
#pb-prod-sec-sticky *::before,
#pb-prod-sec-sticky *::after {
  box-sizing: border-box !important;
}

#pb-prod-sec-sticky .pb-stk-card {
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  gap: 16px !important;
  padding: 10px 16px !important;
  border: 1px solid var(--pb-line) !important;
  border-radius: 12px !important;
  background: rgba(255, 255, 255, 0.96) !important;
  backdrop-filter: blur(14px) !important;
  -webkit-backdrop-filter: blur(14px) !important;
  box-shadow: 0 16px 40px rgba(6, 23, 59, 0.16) !important;
}

#pb-prod-sec-sticky .pb-stk-summary {
  display: flex !important;
  align-items: center !important;
  gap: 12px !important;
  min-width: 0 !important;
}

#pb-prod-sec-sticky .pb-stk-thumb {
  width: 52px !important;
  height: 52px !important;
  border-radius: 8px !important;
  object-fit: contain !important;
  background: var(--pb-mist) !important;
  flex-shrink: 0 !important;
  border: 1px solid var(--pb-line) !important;
}

#pb-prod-sec-sticky .pb-stk-meta {
  display: flex !important;
  flex-direction: column !important;
  min-width: 0 !important;
}

#pb-prod-sec-sticky .pb-stk-title {
  font-size: 15px !important;
  font-weight: 750 !important;
  color: var(--pb-ink) !important;
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
}

#pb-prod-sec-sticky .pb-stk-subtitle {
  font-size: 12px !important;
  color: var(--pb-muted) !important;
  font-weight: 550 !important;
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
}

@keyframes pb-spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

#pb-prod-sec-sticky .pb-btn-spinner {
  display: inline-block !important;
  width: 18px !important;
  height: 18px !important;
  animation: pb-spin 0.8s linear infinite !important;
  vertical-align: middle !important;
  flex-shrink: 0 !important;
}

#pb-prod-sec-sticky .pb-stk-btn {
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 8px !important;
  height: 46px !important;
  min-height: 46px !important;
  padding: 0 24px !important;
  border: 0 !important;
  border-radius: 8px !important;
  background: var(--pb-blue) !important;
  color: #ffffff !important;
  font-size: 14px !important;
  font-weight: 750 !important;
  cursor: pointer !important;
  white-space: nowrap !important;
  flex-shrink: 0 !important;
  box-shadow: 0 4px 14px rgba(7, 87, 217, 0.25) !important;
  transition: background 200ms ease, transform 200ms ease !important;
}

#pb-prod-sec-sticky .pb-stk-btn.is-loading {
  pointer-events: none !important;
  cursor: wait !important;
  opacity: 1 !important;
  filter: none !important;
}

#pb-prod-sec-sticky .pb-stk-btn:hover {
  background: var(--pb-navy) !important;
  transform: translateY(-1px) !important;
}

#pb-prod-sec-sticky .pb-stk-btn svg {
  width: 17px !important;
  height: 17px !important;
  fill: none !important;
  stroke: currentColor !important;
  stroke-width: 2 !important;
}

@media (max-width: 768px) {
  #pb-prod-sec-sticky {
    bottom: 0 !important;
    left: 0 !important;
    right: 0 !important;
    width: 100% !important;
    transform: translateY(110%) !important;
    border-radius: 0 !important;
  }
  #pb-prod-sec-sticky.visible {
    transform: translateY(0) !important;
  }
  #pb-prod-sec-sticky .pb-stk-card {
    border-radius: 0 !important;
    border-left: 0 !important;
    border-right: 0 !important;
    border-bottom: 0 !important;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)) !important;
  }
  #pb-prod-sec-sticky .pb-stk-btn {
    padding: 0 16px !important;
    font-size: 13px !important;
  }
}
</style>

<div id="pb-prod-sec-sticky" class="pb-prod-section pb-stk-wrap" aria-hidden="true">
  <div class="pb-stk-card">
    <div class="pb-stk-summary">
      <img id="pb-sticky-thumb" class="pb-stk-thumb" src="https://e-assets.beeketing.net/10690/10690847/themes/17892693643c6457e34f.jpeg" alt="RestAlign Pillow" />
      <div class="pb-stk-meta">
        <strong class="pb-stk-title">RestAlign Pillow</strong>
        <span id="pb-sticky-subtitle" class="pb-stk-subtitle">2 pillows</span>
      </div>
    </div>
    <button type="button" class="pb-stk-btn" id="pb-sticky-atc-btn">
      <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span>Add to cart - <strong id="pb-sticky-btn-price">£88.99</strong></span>
    </button>
  </div>
</div>

<script>
(function() {
  var defaultStickyThumb = 'https://e-assets.beeketing.net/10690/10690847/themes/17892693643c6457e34f.jpeg';

  function initSticky() {
    var bar = document.getElementById('pb-prod-sec-sticky');
    if (!bar || bar.dataset.initialized === 'true') return;
    bar.dataset.initialized = 'true';

    var thumb = document.getElementById('pb-sticky-thumb');
    var subtitle = document.getElementById('pb-sticky-subtitle');
    var priceEl = document.getElementById('pb-sticky-btn-price');
    var atcBtn = document.getElementById('pb-sticky-atc-btn');

    function syncState() {
      var state = window.juujoProductState;
      if (!state) return;

      if (thumb) {
        thumb.src = defaultStickyThumb;
      }

      if (subtitle) {
        var bundleLabel = state.selectedBundle === 1 ? '1 pillow' : (state.selectedBundle + ' pillows');
        if (state.includeCovers) bundleLabel += ' + matching covers';
        subtitle.textContent = bundleLabel;
      }

      if (priceEl && typeof state.getTotalCents === 'function') {
        priceEl.textContent = state.formatMoney(state.getTotalCents());
      }
    }

    // Scroll Visibility Observer
    var heroAtc = document.getElementById('hero-add-to-cart');
    function checkVisibility() {
      if (heroAtc) {
        var rect = heroAtc.getBoundingClientRect();
        if (rect.bottom < 0) {
          bar.classList.add('visible');
          bar.setAttribute('aria-hidden', 'false');
        } else {
          bar.classList.remove('visible');
          bar.setAttribute('aria-hidden', 'true');
        }
      } else {
        if (window.scrollY > 450) {
          bar.classList.add('visible');
          bar.setAttribute('aria-hidden', 'false');
        } else {
          bar.classList.remove('visible');
          bar.setAttribute('aria-hidden', 'true');
        }
      }
    }

    window.addEventListener('scroll', checkVisibility, { passive: true });
    window.addEventListener('resize', checkVisibility);
    checkVisibility();

    // Event listener for state changes
    window.addEventListener('juujo:state-change', syncState);
    syncState();

    // Sticky Add to Cart Click
    if (atcBtn) {
      atcBtn.addEventListener('click', async function() {
        // Activate ATC in-progress state to suppress drawer popup only for this action
        document.body.classList.add('pb-atc-in-progress');

        // Luxury Animated Loading State (Solid branded button, zero blur/opacity drop)
        atcBtn.classList.add('is-loading');
        atcBtn.innerHTML = '<svg class="pb-btn-spinner" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,0.28)" stroke-width="2.75"></circle><circle cx="12" cy="12" r="9" stroke="#ffffff" stroke-width="2.75" stroke-dasharray="20 40" stroke-linecap="round"></circle></svg><span style="font-weight:750;font-size:14px;">Adding to cart...</span>';

        var heroBtn = document.getElementById('hero-add-to-cart');
        if (heroBtn) {
          heroBtn.click();
          return;
        }

        var state = window.juujoProductState;
        if (!state) return;

        var activePillows = state.pillows.slice(0, state.selectedBundle);
        var items = activePillows.map(function(p, i) {
          var variantKey = p.colour + '_' + p.height;
          var varId = state.variantIds[variantKey] || '1000020747722825';
          var prodId = (p.height === 'high') ? (state.productIds && state.productIds['high'] || '1000000676452167') : (state.productIds && state.productIds['regular'] || '1000000676452166');
          return {
            id: varId,
            product_id: prodId,
            variant_id: varId,
            quantity: 1,
            properties: {
              'Pillow Position': (i + 1) + ' of ' + state.selectedBundle,
              'Colour': state.colourNames[p.colour] || p.colour,
              'Height': p.height.toUpperCase(),
              'Cooling Cover': state.includeCovers ? 'Yes' : 'No'
            }
          };
        });

        if (state.includeCovers) {
          items.push({
            id: state.variantIds['cooling_cover'],
            variant_id: state.variantIds['cooling_cover'],
            quantity: state.selectedBundle,
            properties: { 'Bundle Match': state.selectedBundle + ' Pillows' }
          });
        }

        var discountCode = state.discounts[state.selectedBundle] || '';
        var cartUrl = '/cart' + (discountCode ? ('?discount=' + encodeURIComponent(discountCode)) : '');

        if (window.sbsdk && window.sbsdk.cart && typeof window.sbsdk.cart.add === 'function') {
          try {
            for (var k = 0; k < items.length; k++) {
              var itm = items[k];
              await window.sbsdk.cart.add(Number(itm.variant_id) || itm.variant_id, itm.quantity || 1);
            }
          } catch (err) {
            console.error('Error adding items to sbsdk cart:', err);
          }
          window.location.href = cartUrl;
          return;
        }

        if (window.sbsdk && typeof window.sbsdk.ready === 'function') {
          window.sbsdk.ready(async function() {
            try {
              for (var k = 0; k < items.length; k++) {
                var itm = items[k];
                await window.sbsdk.cart.add(Number(itm.variant_id) || itm.variant_id, itm.quantity || 1);
              }
            } catch (err) {}
            window.location.href = cartUrl;
          });
          return;
        }

        window.location.href = cartUrl;
      });
    }
    // Ensure header cart clicks work normally and clear any in-progress state
    document.addEventListener('click', function(e) {
      if (!e.target.closest('#hero-add-to-cart') && !e.target.closest('#pb-sticky-atc-btn') && !e.target.closest('#pb-comb-sticky-atc-btn')) {
        document.body.classList.remove('pb-atc-in-progress');
      }
    }, true);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initSticky);
  } else {
    initSticky();
  }
})();
</script>
